<!DOCTYPE html>
<html lang="id">
  <head>
    <title>Kode Pesanan</title>
    
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!--bootstrap-->
    <link rel="stylesheet" href="bootstrap/dist/css/bootstrap.min.css">
    <script src="bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    
    <!--external css-->
    <link rel="stylesheet" href="css/main202510121.css">
    
    <!-- JS to store file name (see header202510121.js) -->
    <script>const docname = "/order.html"</script>
  </head>
  <body style="text-align:center;">
    <!--header-->
    <script src="header202510121.js"></script>
    
    <div>
      <img src="asset/logo.png" width="300" height="261"><br>
      <span id="succ"></span>
    </div>
    <script>
      succ = document.querySelector ("#succ");
      code = "";
      for (i = 0; i < 6; i++) {
        code += Math.trunc(Math.random ()*10);
      }
      succ.innerHTML = `Pesanan anda telah kami terima. 
        Tunjukkan nomor tiket ini ketika mengambil makanan 
        dan membayar di kantin : ${code}`;
    </script>
    
    <!-- scripts -->
    <script src="js/element_manipulator202510121.js"></script>
    <script src="footer202510121.js"></script>
  </body>  
</html>
